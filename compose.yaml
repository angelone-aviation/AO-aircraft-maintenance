services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - npm_cache:/home/node/.npm
    ports:
      - "127.0.0.1:5173:5173"
      - "127.0.0.1:3210:3210"
      - "127.0.0.1:3211:3211"

volumes:
  node_modules:
  npm_cache:

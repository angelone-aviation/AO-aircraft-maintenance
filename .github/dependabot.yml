# Responsibility: Weekly dependency update pull requests for npm and GitHub Actions.
# Layer: Config (GitHub Dependabot).
# Dependencies: package.json, package-lock.json and .github/workflows/*.yml.
#
# Minor and patch updates arrive as one grouped pull request per ecosystem; major
# updates arrive one by one. New releases wait a week before they are proposed.
# CI must pass before merging.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

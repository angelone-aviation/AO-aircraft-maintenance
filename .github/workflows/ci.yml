# Responsibility: Checks every pull request and every push to main: engineering standards on
#   changed files, typecheck, lint, unit and server tests, build, backup-job tests and browser tests.
# Layer: Tooling (CI). Needs no secrets and never deploys.
# Dependencies: npm, Playwright Chromium, age, .claude/hooks/check-standards.mjs,
#   scripts/serve-dist.mjs (serves the build with the Cloudflare headers in public/_headers).
#
# The browser tests run the production build in demo mode and fail on any
# Content-Security-Policy violation.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every main commit is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the standards check can diff against the push or pull-request base.
          fetch-depth: 0

      - name: Engineering standards on changed files (CONSTRAINTS.md)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .claude/hooks/check-standards.mjs --changed-since "$BASE_SHA"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests and build
        run: npm run check

      - name: Backup job tests (fake Convex and R2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          npm run test:backup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (production build, production headers)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

# Responsibility: Checks every pull request and push to main: standards on
#   changed files, typecheck, lint, unit and server tests, build, Markdown
#   formatting, backup-job tests, browser tests, production dependency audit
#   and secret scan.
# Layer: Tooling (CI). Needs no secrets and never deploys; a green run for a
#   push to main starts deploy.yml, so every job here gates production.
# Dependencies: npm, Playwright Chromium, age, gitleaks, .gitleaks.toml,
#   .claude/hooks/check-standards.mjs, scripts/serve-dist.mjs.
#
# The browser tests serve the production build in demo mode with the
# Cloudflare headers in public/_headers, and fail on any CSP violation.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled. A main run is never stopped,
  # but GitHub keeps one waiting run per group, so a newer push replaces it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the standards check can diff against the push or
          # pull-request base.
          fetch-depth: 0

      # After a force push `before` is no longer in the history, and it is all
      # zeros when main is first pushed. Diff from the last commit the old and
      # new tips share instead (GitHub's compare keeps the old tip): that still
      # covers every file the push changed. With no such commit, check every
      # tracked file rather than only the latest commit.
      - name: Engineering standards on changed files (CONSTRAINTS.md)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          has_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          base=$BASE_SHA
          if ! has_commit "$base" && [ -n "$BASE_REF" ]; then
            base=$(git merge-base HEAD "refs/remotes/origin/$BASE_REF" || true)
          elif ! has_commit "$base"; then
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$GITHUB_SHA" \
              --jq .merge_base_commit.sha || true)
          fi
          if ! has_commit "$base"; then
            echo "::warning::No base commit for ${BASE_SHA:-this run}; checking every tracked file."
            mapfile -d '' tracked < <(git ls-files -z)
            exec node .claude/hooks/check-standards.mjs "${tracked[@]}"
          fi
          [ "$base" = "$BASE_SHA" ] ||
            echo "::warning::Base ${BASE_SHA:-none} is not in the history (force push?); checking files changed since $base."
          node .claude/hooks/check-standards.mjs --changed-since "$base"

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests and build
        run: npm run check

      # Only the Markdown: npm run format:check also covers code files that
      # are not yet formatted, and would fail until they are.
      - name: Prettier on the docs
        run: npx --no-install prettier --check "docs/**/*.md" README.md

      - name: Backup job tests (fake Convex and R2)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends age
          npm run test:backup

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests (production build, production headers)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: Dependency audit (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Reads package-lock.json only, so it needs no npm ci.
      - name: High and critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Dependabot does not update this pin: take the version and the
      # linux_x64 line of the release's checksums file together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag, full history: a secret deleted in a later
          # commit is still readable in the history.
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      # Exceptions live only in .gitleaks.toml: inline gitleaks:allow comments
      # are ignored, as CONSTRAINTS.md §7 bans inline suppressions.
      - name: Scan the git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --ignore-gitleaks-allow .

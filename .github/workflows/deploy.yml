# Responsibility: Releases main to production: Convex functions and schema
#   first, then the website on Cloudflare.
# Layer: Tooling (release workflow). Runs after a green CI push to main, or
#   by hand from main (with a backup confirmation).
# Dependencies: the Convex CLI, wrangler, Sentry (optional), and the
#   "production" environment. Runbooks: docs/runbooks/release.md, monitoring.md.
name: Deploy

on:
  # Auto-deploy when CI finishes green for a push to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      backup_taken:
        description: "I took a Convex backup of production and saved its environment variables (docs/runbooks/backup-restore.md)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Dependabot does not update this pin: raise it together with the version in
  # docs/runbooks/release.md.
  WRANGLER_VERSION: 4.151.3

jobs:
  deploy:
    name: Deploy to production
    # Manual: main only, after the backup box is ticked.
    # Auto: green CI that was itself a push to main in this repository (not a
    # pull-request or fork CI run).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    # workflow_run's GITHUB_SHA is the tip of the default branch when this
    # workflow file is read, not the commit CI verified. Prefer that commit.
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require a backup first
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.backup_taken }}
        run: |
          echo "::error::Take a Convex backup and save the environment variables before deploying (docs/runbooks/backup-restore.md), then run the workflow again with the box ticked."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For auto-deploy, build the commit CI already verified. Full history,
          # so the next step can check it against main.
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      # head_branch holds the tag name when a tag push started CI, so a tag
      # called "main" on any commit passes the job condition. This check runs
      # before npm ci, the first step that executes code from the checkout.
      - name: Require a commit on main
        run: |
          git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/origin/main || {
            echo "::error::Commit ${DEPLOY_SHA::12} is not on main; Deploy only releases commits on main."
            exit 1
          }

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests and build
        run: npm run check

      # `convex deploy` runs BUILD with the production URL in VITE_CONVEX_URL,
      # then pushes the functions and schema. If BUILD fails nothing is pushed.
      # Secrets live on the protected "production" environment, never on the
      # repository.
      - name: Deploy Convex and build the site against it
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_ALLOW_DEMO: "false"
          # Error reporting (docs/runbooks/monitoring.md). Unset, the site is
          # built exactly as before. The DSN is public, so it is a variable.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ env.DEPLOY_SHA }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # The map check runs here, not in "Verify the build", so a bad build
          # stops before Convex is changed.
          BUILD: |
            set -eu
            node scripts/check-csp-origin.mjs "$VITE_CONVEX_URL"
            node scripts/check-csp-origin.mjs --sentry-dsn "$VITE_SENTRY_DSN"
            rm -rf dist
            npm run build
            maps=$(find dist -name '*.map')
            if [ -n "$maps" ]; then
              echo "::error::Source maps must never be published: $maps"
              exit 1
            fi
            echo "url=$VITE_CONVEX_URL" >> "$GITHUB_OUTPUT"
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY must be a production deploy key (prod:...)."
              exit 1
              ;;
          esac
          npx convex deploy --cmd "$BUILD" --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Verify the build
        env:
          CONVEX_URL: ${{ steps.convex.outputs.url }}
        run: |
          test -n "$CONVEX_URL"
          test -f dist/index.html
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -rqF "$CONVEX_URL" dist/assets || {
            echo "::error::The build does not use $CONVEX_URL"
            exit 1
          }

      - name: Publish the site to Cloudflare
        env:
          # A token from the "Edit Cloudflare Workers" template.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          --tag "${DEPLOY_SHA::12}"
          --message "Commit ${DEPLOY_SHA::12}, workflow run ${GITHUB_RUN_ID}"

      - name: Smoke check the live site
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # Public curls from GitHub-hosted runners often get HTTP 403 from
        # Cloudflare bot/WAF defenses even when the Worker is healthy. Always
        # confirm the version tag we just published is active; then try the
        # public URL and fall back cleanly on a persistent 403.
        run: |
          set -eu
          tag="${DEPLOY_SHA::12}"
          deployments=$(npx --yes "wrangler@${WRANGLER_VERSION}" deployments list --name angel-one)
          echo "$deployments"
          echo "$deployments" | grep -F "$tag" >/dev/null || {
            echo "::error::Active Cloudflare deployments do not include tag $tag."
            exit 1
          }

          if headers=$(curl -fsS --retry 6 --retry-all-errors --retry-delay 10 -D - -o /dev/null "$PRODUCTION_URL/"); then
            echo "$headers"
            echo "$headers" | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
            echo "$headers" | grep -qi "^strict-transport-security:"
            curl -fsS "$PRODUCTION_URL/work-orders" | grep -q '<div id="root">'
            exit 0
          fi

          code=$(curl -sS -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/" || true)
          if [ "$code" = "403" ]; then
            echo "::warning::Public URL returned 403 from this runner (Cloudflare bot/WAF). Version tag $tag is live; skipping public header curl."
            exit 0
          fi
          echo "::error::Public URL returned HTTP ${code:-unknown} after deploy."
          exit 1

      - name: Summary
        if: ${{ always() }}
        env:
          CONVEX_URL: ${{ steps.convex.outputs.url }}
        run: |
          {
            echo "### Deploy ${DEPLOY_SHA::12}: ${{ job.status }}"
            echo ""
            echo "- Convex deployment: ${CONVEX_URL:-not reached}"
            echo "- Cloudflare Worker version tag: ${DEPLOY_SHA::12} (wrangler ${WRANGLER_VERSION})"
            echo ""
            echo "Next: run the post-deploy commands in docs/runbooks/release.md and check the site."
            echo "Roll back the website with Cloudflare (Workers > angel-one > Deployments). Convex cannot be rolled back: fix forward."
          } >> "$GITHUB_STEP_SUMMARY"

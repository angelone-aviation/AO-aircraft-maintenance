# Responsibility: Releases main to production: Convex functions and schema
#   first, then the website on Cloudflare.
# Layer: Tooling (release workflow). Started by hand only, from main.
# Dependencies: the Convex CLI, wrangler, and the "production" environment.
#   Runbook: docs/runbooks/release.md.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      backup_taken:
        description: "I took a Convex backup of production and saved its environment variables (docs/runbooks/backup-restore.md)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Dependabot does not update this pin: raise it together with the version in
  # docs/runbooks/release.md.
  WRANGLER_VERSION: 4.151.3

jobs:
  deploy:
    name: Deploy to production
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    steps:
      - name: Require a backup first
        if: ${{ !inputs.backup_taken }}
        run: |
          echo "::error::Take a Convex backup and save the environment variables before deploying (docs/runbooks/backup-restore.md), then run the workflow again with the box ticked."
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests and build
        run: npm run check

      # `convex deploy` runs BUILD with the production URL in VITE_CONVEX_URL,
      # then pushes the functions and schema. If BUILD fails nothing is pushed.
      # Secrets live on the protected "production" environment, never on the
      # repository.
      - name: Deploy Convex and build the site against it
        id: convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_DEMO_MODE: "false"
          VITE_ALLOW_DEMO: "false"
          BUILD: |
            set -eu
            node scripts/check-csp-origin.mjs "$VITE_CONVEX_URL"
            rm -rf dist
            npm run build
            echo "url=$VITE_CONVEX_URL" >> "$GITHUB_OUTPUT"
        run: |
          case "$CONVEX_DEPLOY_KEY" in
            prod:*) ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY must be a production deploy key (prod:...)."
              exit 1
              ;;
          esac
          npx convex deploy --cmd "$BUILD" --cmd-url-env-var-name VITE_CONVEX_URL

      - name: Verify the build
        env:
          CONVEX_URL: ${{ steps.convex.outputs.url }}
        run: |
          test -n "$CONVEX_URL"
          test -f dist/index.html
          test -f dist/_headers
          grep -q "Content-Security-Policy" dist/_headers
          grep -rqF "$CONVEX_URL" dist/assets || {
            echo "::error::The build does not use $CONVEX_URL"
            exit 1
          }

      - name: Publish the site to Cloudflare
        env:
          # A token from the "Edit Cloudflare Workers" template.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy
          --tag "${GITHUB_SHA::12}"
          --message "Commit ${GITHUB_SHA::12}, workflow run ${GITHUB_RUN_ID}"

      - name: Smoke check the live site
        if: ${{ vars.PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        # A first deploy to a new custom domain answers 403 or not at all for a
        # minute or two while Cloudflare issues its certificate, so wait up to
        # about three minutes before calling the site broken.
        run: |
          headers=$(curl -fsS --retry 18 --retry-all-errors --retry-delay 10 -D - -o /dev/null "$PRODUCTION_URL/")
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: .*frame-ancestors 'none'"
          echo "$headers" | grep -qi "^strict-transport-security:"
          curl -fsS "$PRODUCTION_URL/work-orders" | grep -q '<div id="root">'

      - name: Summary
        if: ${{ always() }}
        env:
          CONVEX_URL: ${{ steps.convex.outputs.url }}
        run: |
          {
            echo "### Deploy ${GITHUB_SHA::12}: ${{ job.status }}"
            echo ""
            echo "- Convex deployment: ${CONVEX_URL:-not reached}"
            echo "- Cloudflare Worker version tag: ${GITHUB_SHA::12} (wrangler ${WRANGLER_VERSION})"
            echo ""
            echo "Next: run the post-deploy commands in docs/runbooks/release.md and check the site."
            echo "Roll back the website with Cloudflare (Workers > angel-one > Deployments). Convex cannot be rolled back: fix forward."
          } >> "$GITHUB_STEP_SUMMARY"
